<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Live Chat Room</h2>
        </div>

        <div id="chat-window" class="chat-window">
            </div>

        <form id="chat-form" class="chat-form">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZgVq1OUZX4Hv6on-SflRZEGgqyrhpCzc",
            authDomain: "chopperchatter.firebaseapp.com",
            projectId: "chopperchatter",
            storageBucket: "chopperchatter.firebasestorage.app",
            messagingSenderId: "763749965220",
            appId: "1:763749965220:web:394095434cf3c2dca2f531",
            measurementId: "G-F1P35FVF0C"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        // Give this specific browser tab a unique user ID
        let myUserId = localStorage.getItem('chat_user_id');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_user_id', myUserId);
        }

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatWindow = document.getElementById('chat-window');

        // Send message along with the sender's unique ID
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const messageText = messageInput.value.trim();
            if (messageText === '') return;

            push(messagesRef, {
                text: messageText,
                sender: myUserId,
                timestamp: Date.now()
            });
            messageInput.value = '';
        });

        // Listen for messages and check if it's yours or someone else's
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messageDiv = document.createElement('div');
            
            messageDiv.classList.add('message');
            
            // If the sender matches this tab's ID, make it 'outgoing' (right side)
            // Otherwise, make it 'incoming' (left side)
            if (data.sender === myUserId) {
                messageDiv.classList.add('outgoing');
            } else {
                messageDiv.classList.add('incoming');
            }

            messageDiv.innerHTML = `<span class="text">${escapeHtml(data.text || '')}</span>`;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // Security helper to prevent HTML injection
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>

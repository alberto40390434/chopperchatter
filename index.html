<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <h2>My Chat Room</h2>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-window" class="chat-window">
            <div class="message incoming">
                <span class="text">Welcome to the chat! Say something below.</span>
            </div>
        </div>

        <!-- Message Input Form -->
        <form id="chat-form" class="chat-form">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- JavaScript to make it interactive -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatWindow = document.getElementById('chat-window');

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page from refreshing

            const messageText = messageInput.value.trim();
            if (messageText === '') return;

            // Create message element for the user
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'outgoing');
            messageDiv.innerHTML = `<span class="text">${escapeHtml(messageText)}</span>`;

            // Add message to chat window
            chatWindow.appendChild(messageDiv);

            // Clear input and scroll to the bottom
            messageInput.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // Simple security helper to prevent HTML injection
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>

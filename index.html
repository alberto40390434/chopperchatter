<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <h2>Live Chat Room</h2>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-window" class="chat-window">
            <!-- Messages will load here dynamically -->
        </div>

        <!-- Message Input Form -->
        <form id="chat-form" class="chat-form">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZgVq1OUZX4Hv6on-SflRZEGgqyrhpCzc",
            authDomain: "chopperchatter.firebaseapp.com",
            projectId: "chopperchatter",
            storageBucket: "chopperchatter.firebasestorage.app",
            messagingSenderId: "763749965220",
            appId: "1:763749965220:web:394095434cf3c2dca2f531",
            measurementId: "G-F1P35FVF0C"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatWindow = document.getElementById('chat-window');

        // Send message to Realtime Database on form submit
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const messageText = messageInput.value.trim();
            if (messageText === '') return;

            push(messagesRef, {
                text: messageText,
                timestamp: Date.now()
            });
            messageInput.value = '';
        });

        // Listen for new messages in real-time
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'incoming');
            messageDiv.innerHTML = `<span class="text">${escapeHtml(data.text || '')}</span>`;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // Security helper to prevent HTML injection
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
